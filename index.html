<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Task Planner</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --grid-color: #1a1a1a;
            --node-bg: #1e1e1e;
            --node-header: #2a2a2a;
            --text-main: #e0e0e0;
            --text-dim: #888888;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.3);
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 40px 40px;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            color: var(--text-main);
        }

        #toolbar {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(30, 30, 30, 0.9);
            backdrop-filter: blur(12px);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            gap: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }

        button {
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: #2563eb; transform: translateY(-1px); }

        .btn-danger { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid var(--danger); }
        .btn-danger:hover { background: var(--danger); color: white; }

        #canvas {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        #wires-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Node Styling - Cleaned up outer borders */
        .node {
            position: absolute;
            width: 240px;
            background: transparent; /* Removed background & border wrapper */
            border: none;
            border-radius: 8px;
            padding: 0;
            z-index: 10;
            user-select: none;
        }

        .node-header {
            background: var(--node-header);
            padding: 10px 14px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .node:hover .node-header {
            border-color: var(--accent);
            box-shadow: 0 8px 28px rgba(0,0,0,0.6), 0 0 12px var(--accent-glow);
        }

        .node-title {
            font-size: 13px;
            font-weight: 600;
            border: none;
            background: transparent;
            color: white;
            width: 80%;
            outline: none;
            user-select: text;
        }

        .delete-node {
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
        }

        .delete-node:hover { color: var(--danger); }

        /* Ports */
        .port {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #666;
            border: 2px solid var(--node-header);
            border-radius: 50%;
            cursor: crosshair;
            z-index: 20;
            transition: all 0.2s;
        }

        .port:hover {
            background: var(--accent);
            box-shadow: 0 0 12px var(--accent-glow);
            transform: translateY(-50%) scale(1.3);
        }

        .port-in { left: -6px; top: 50%; transform: translateY(-50%); }
        .port-out { right: -6px; top: 50%; transform: translateY(-50%); }

        /* Wires */
        .temp-wire {
            stroke: var(--accent);
            stroke-width: 3;
            fill: none;
            stroke-dasharray: 6;
            animation: dash 15s linear infinite;
        }

        @keyframes dash {
            to { stroke-dashoffset: -1000; }
        }

        .permanent-wire {
            stroke: var(--text-dim);
            stroke-width: 2;
            fill: none;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div id="toolbar">
        <button id="add-btn" class="btn-primary">+ New Task</button>
        <button id="clear-btn" class="btn-danger">Clear All</button>
    </div>

    <div id="canvas">
        <svg id="wires-layer"></svg>
    </div>

    <!-- 1. Add Firebase SDKs inside your <head> section -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
    // 2. Paste your free Firebase Config here (from console.firebase.google.com)
    const firebaseConfig = {
    apiKey: "YOUR_API_KEY", // Retrieve this from your Firebase Console
    authDomain: "server-planner.firebaseapp.com",
    databaseURL: "https://server-planner-default-rtdb.firebaseio.com", 
    projectId: "server-planner",
    storageBucket: "server-planner.firebasestorage.app",
    messagingSenderId: "27100250455", // Pre-filled with your Project Number!
    appId: "YOUR_APP_ID" // Retrieve this from your Firebase Console
};


    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const canvas = document.getElementById('canvas');
    const wiresLayer = document.getElementById('wires-layer');
    const addBtn = document.getElementById('add-btn');
    const clearBtn = document.getElementById('clear-btn');

    let nodes = [];
    let connections = [];
    let isDraggingNode = null;
    let isDraggingWire = null;
    let dragOffsetX, dragOffsetY;
    let mousePos = { x: 0, y: 0 };
    let isRemoteUpdate = false; // Prevents infinite sync loops

    // --- SAVE TO FIREBASE ---
    function saveToCloud() {
        if (isRemoteUpdate) return;
        
        // Strip DOM elements before sending raw data to database
        const cleanNodes = nodes.map(n => ({ id: n.id, x: n.x, y: n.y, title: n.title }));
        
        db.ref('planner_state').set({
            nodes: cleanNodes,
            connections: connections
        });
    }

    // --- LOAD FROM FIREBASE REAL-TIME ---
    db.ref('planner_state').on('value', (snapshot) => {
        const data = snapshot.val();
        isRemoteUpdate = true;

        // Clear local DOM nodes
        document.querySelectorAll('.node').forEach(el => el.remove());
        nodes = [];
        connections = [];

        if (data) {
            if (data.nodes) {
                data.nodes.forEach(n => createNode(n.x, n.y, n.id, n.title, false));
            }
            if (data.connections) {
                connections = data.connections;
            }
        }

        renderWires();
        isRemoteUpdate = false;
    });

    function createNode(x, y, id, title = null, shouldSave = true) {
        const node = {
            id,
            x,
            y,
            title: title || `Task ${nodes.length + 1}`,
            element: null
        };

        const el = document.createElement('div');
        el.className = 'node';
        el.id = `node-${id}`;
        el.style.left = x + 'px';
        el.style.top = y + 'px';

        el.innerHTML = `
            <div class="node-header">
                <input type="text" class="node-title" value="${node.title}">
                <button class="delete-node">&times;</button>
            </div>
            <div class="port port-in" data-type="in"></div>
            <div class="port port-out" data-type="out"></div>
        `;

        el.onmousedown = (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || e.target.classList.contains('port')) return;
            isDraggingNode = node;
            dragOffsetX = e.clientX - node.x;
            dragOffsetY = e.clientY - node.y;
            el.style.zIndex = 100;
        };

        el.querySelector('.delete-node').onclick = () => {
            nodes = nodes.filter(n => n.id !== id);
            connections = connections.filter(c => c.fromId !== id && c.toId !== id);
            el.remove();
            renderWires();
            saveToCloud();
        };

        el.querySelector('.node-title').oninput = (e) => {
            node.title = e.target.value;
            saveToCloud();
        };

        node.element = el;
        nodes.push(node);
        canvas.appendChild(el);
        
        if (shouldSave) saveToCloud();
    }

    window.onmousemove = (e) => {
        const rect = canvas.getBoundingClientRect();
        mousePos.x = e.clientX - rect.left;
        mousePos.y = e.clientY - rect.top;

        if (isDraggingNode) {
            isDraggingNode.x = mousePos.x - dragOffsetX;
            isDraggingNode.y = mousePos.y - dragOffsetY;
            isDraggingNode.element.style.left = isDraggingNode.x + 'px';
            isDraggingNode.element.style.top = isDraggingNode.y + 'px';
            renderWires();
        }

        if (isDraggingWire) renderWires();
    };

    window.onmouseup = (e) => {
        if (isDraggingNode) saveToCloud();

        if (isDraggingWire) {
            const targetPort = e.target.closest('.port');
            if (targetPort && targetPort.dataset.type === 'in') {
                const targetNodeId = parseInt(targetPort.closest('.node').id.split('-')[1]);
                const sourceNodeId = isDraggingWire.fromId;
                
                if (sourceNodeId !== targetNodeId) {
                    connections.push({ fromId: sourceNodeId, toId: targetNodeId });
                    saveToCloud();
                }
            }
        }
        
        isDraggingNode = null;
        isDraggingWire = null;
        renderWires();
    };

    canvas.onmousedown = (e) => {
        const port = e.target.closest('.port');
        if (port && port.dataset.type === 'out') {
            const nodeId = parseInt(port.closest('.node').id.split('-')[1]);
            isDraggingWire = { fromId: nodeId, x: mousePos.x, y: mousePos.y };
        }
    };

    function renderWires() {
        wiresLayer.innerHTML = '';

        connections.forEach(conn => {
            const fromNode = nodes.find(n => n.id === conn.fromId);
            const toNode = nodes.find(n => n.id === conn.toId);
            if (fromNode && toNode) drawBezier(fromNode, toNode, 'permanent-wire');
        });

        if (isDraggingWire) {
            const fromNode = nodes.find(n => n.id === isDraggingWire.fromId);
            const outPort = fromNode.element.querySelector('.port-out');
            const rect = outPort.getBoundingClientRect();
            const canvasRect = canvas.getBoundingClientRect();
            
            const startX = rect.left - canvasRect.left + 6;
            const startY = rect.top - canvasRect.top + 6;

            drawBezier(fromNode, {
                element: {
                    querySelector: () => ({ getBoundingClientRect: () => ({ left: mousePos.x, top: mousePos.y }) })
                }
            }, 'temp-wire', startX, startY);
        }
    }

    function drawBezier(fromNode, toNode, className, startX, startY) {
        const fromPort = fromNode.element.querySelector('.port-out').getBoundingClientRect();
        const toPort = toNode.element.querySelector('.port-in').getBoundingClientRect();
        const canvasRect = canvas.getBoundingClientRect();

        const x1 = fromPort.left - canvasRect.left + 6;
        const y1 = fromPort.top - canvasRect.top + 6;
        const x2 = toPort.left - canvasRect.left + 6;
        const y2 = toPort.top - canvasRect.top + 6;

        const sX = startX !== undefined ? startX : x1;
        const sY = startY !== undefined ? startY : y1;

        const cp1x = sX + (x2 - sX) * 0.5;
        const cp2x = sX + (x2 - sX) * 0.5;

        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", `M ${sX} ${sY} C ${cp1x} ${sY}, ${cp2x} ${y2}, ${x2} ${y2}`);
        path.setAttribute("class", className);
        wiresLayer.appendChild(path);
    }

    addBtn.onclick = () => createNode(window.innerWidth / 2 - 120, window.innerHeight / 2 - 20, Date.now());

    clearBtn.onclick = () => {
        nodes.forEach(n => n.element.remove());
        nodes = [];
        connections = [];
        renderWires();
        saveToCloud();
    };
</script>
</body>
</html>

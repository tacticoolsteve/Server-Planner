<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM Server Planner</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --grid-color: #161f33;
            --node-bg: #111827;
            --node-header: #1f2937;
            --text-main: #f3f4f6;
            --text-dim: #9ca3af;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.4);
            --danger: #ef4444;

            /* Status Colors */
            --status-todo: #3b82f6;
            --status-inprog: #f59e0b;
            --status-testing: #a855f7;
            --status-done: #10b981;
            --status-blocked: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            color: var(--text-main);
        }

        #viewport {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            overflow: hidden;
            cursor: grab;
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        #viewport.panning {
            cursor: grabbing;
        }

        #world {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform-origin: 0 0;
        }

        #toolbar {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(12px);
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }

        .title-brand {
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 0.5px;
            color: #fff;
            padding-right: 10px;
            border-right: 1px solid rgba(255, 255, 255, 0.15);
        }

        .title-brand span {
            color: var(--accent);
        }

        button {
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: #2563eb; transform: translateY(-1px); }

        .btn-secondary { background: rgba(255, 255, 255, 0.08); color: var(--text-main); border: 1px solid rgba(255, 255, 255, 0.1); }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.15); }

        .btn-danger { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid var(--danger); }
        .btn-danger:hover { background: var(--danger); color: white; }

        #wires-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 10000px;
            height: 10000px;
            pointer-events: none;
            z-index: 1;
        }

        /* Node Styling */
        .node {
            position: absolute;
            width: 250px;
            background: var(--node-bg);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 10;
            user-select: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            overflow: hidden;
        }

        .node::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--status-color, var(--accent));
        }

        .node.wire-target-hover {
            border-color: var(--accent) !important;
            box-shadow: 0 0 25px var(--accent-glow) !important;
            transform: scale(1.02);
        }

        .node-header {
            background: var(--node-header);
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .node-title {
            font-size: 13px;
            font-weight: 600;
            border: none;
            background: transparent;
            color: white;
            width: 80%;
            outline: none;
            user-select: text;
        }

        .delete-node {
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
        }

        .delete-node:hover { color: var(--danger); }

        .node-body {
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .status-select {
            background: rgba(0, 0, 0, 0.4);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 11px;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            width: 100%;
        }

        /* Ports */
        .port {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #6b7280;
            border: 2px solid var(--node-bg);
            border-radius: 50%;
            cursor: crosshair;
            z-index: 20;
            transition: transform 0.2s, background 0.2s;
        }

        .port:hover {
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
            transform: translateY(-50%) scale(1.3);
        }

        .port-in { left: -6px; top: 50%; transform: translateY(-50%); }
        .port-out { right: -6px; top: 50%; transform: translateY(-50%); }

        /* Wires Styling */
        path.wire {
            fill: none;
            pointer-events: stroke;
            cursor: pointer;
            transition: stroke 0.2s, stroke-width 0.2s;
        }

        .permanent-wire {
            stroke: var(--text-dim);
            stroke-width: 3;
            opacity: 0.6;
        }

        .permanent-wire:hover {
            stroke: var(--danger) !important;
            stroke-width: 5 !important;
            opacity: 1 !important;
            filter: drop-shadow(0 0 6px var(--danger));
        }

        .temp-wire {
            stroke: var(--accent);
            stroke-width: 3;
            stroke-dasharray: 6;
            animation: dash 15s linear infinite;
        }

        @keyframes dash {
            to { stroke-dashoffset: -1000; }
        }

        /* Minimap */
        #minimap-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 160px;
            height: 100px;
            background: rgba(17, 24, 39, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 1000;
            pointer-events: none;
        }

        #minimap-svg {
            width: 100%;
            height: 100%;
        }

        .minimap-node {
            fill: var(--accent);
            opacity: 0.8;
            rx: 2px;
        }

        .minimap-view {
            fill: rgba(255, 255, 255, 0.05);
            stroke: rgba(255, 255, 255, 0.4);
            stroke-width: 1.5;
            rx: 3px;
        }
    </style>
</head>
<body>

    <div id="toolbar">
        <div class="title-brand">FiveM <span>Planner</span></div>
        <button id="add-btn" class="btn-primary">+ New Task</button>
        <button id="reset-view-btn" class="btn-secondary">Reset View</button>
        <button id="clear-btn" class="btn-danger">Clear All</button>
    </div>

    <div id="viewport">
        <div id="world">
            <svg id="wires-layer"></svg>
        </div>
    </div>

    <div id="minimap-container">
        <svg id="minimap-svg">
            <rect id="minimap-view" class="minimap-view" />
        </svg>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyAoWuCRGVK-BfvHqcFrEdXGInhHccJjV2M",
      authDomain: "server-planner.firebaseapp.com",
      databaseURL: "https://server-planner-default-rtdb.firebaseio.com",
      projectId: "server-planner",
      storageBucket: "server-planner.firebasestorage.app",
      messagingSenderId: "27100250455",
      appId: "1:27100250455:web:ea1211307596e662e63e12",
      measurementId: "G-FLPBQMX11N"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const viewport = document.getElementById('viewport');
    const world = document.getElementById('world');
    const wiresLayer = document.getElementById('wires-layer');
    const addBtn = document.getElementById('add-btn');
    const resetViewBtn = document.getElementById('reset-view-btn');
    const clearBtn = document.getElementById('clear-btn');
    const minimapSvg = document.getElementById('minimap-svg');
    const minimapView = document.getElementById('minimap-view');

    let nodes = [];
    let connections = [];
    let isDraggingNode = null;
    let isDraggingWire = null;
    let dragOffsetX, dragOffsetY;
    
    // Pan & Zoom State
    let panX = 0, panY = 0;
    let zoom = 1;
    let isPanning = false;
    let startPanX = 0, startPanY = 0;
    let isSpacePressed = false;

    let mouseWorldPos = { x: 0, y: 0 };
    let saveTimeout = null;

    const STATUS_COLORS = {
        'todo': 'var(--status-todo)',
        'inprog': 'var(--status-inprog)',
        'testing': 'var(--status-testing)',
        'done': 'var(--status-done)',
        'blocked': 'var(--status-blocked)'
    };

    function updateTransform() {
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
        viewport.style.backgroundPosition = `${panX}px ${panY}px`;
        viewport.style.backgroundSize = `${40 * zoom}px ${40 * zoom}px`;
        renderMinimap();
    }

    // --- PAN & ZOOM LISTENERS ---
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && document.activeElement.tagName !== 'INPUT') {
            isSpacePressed = true;
            viewport.classList.add('panning');
        }
    });

    window.addEventListener('keyup', (e) => {
        if (e.code === 'Space') {
            isSpacePressed = false;
            viewport.classList.remove('panning');
        }
    });

    viewport.onmousedown = (e) => {
        if (e.button === 1 || (e.button === 0 && isSpacePressed) || e.target === viewport || e.target === world) {
            isPanning = true;
            startPanX = e.clientX - panX;
            startPanY = e.clientY - panY;
            viewport.classList.add('panning');
        }
    };

    window.addEventListener('mousemove', (e) => {
        if (isPanning) {
            panX = e.clientX - startPanX;
            panY = e.clientY - startPanY;
            updateTransform();
            return;
        }

        // Convert Mouse Screen Pos to World Pos
        mouseWorldPos.x = (e.clientX - panX) / zoom;
        mouseWorldPos.y = (e.clientY - panY) / zoom;

        if (isDraggingNode) {
            isDraggingNode.x = mouseWorldPos.x - dragOffsetX;
            isDraggingNode.y = mouseWorldPos.y - dragOffsetY;
            isDraggingNode.element.style.left = isDraggingNode.x + 'px';
            isDraggingNode.element.style.top = isDraggingNode.y + 'px';
            renderWires();
            renderMinimap();
        }

        if (isDraggingWire) {
            renderWires();
            checkNodeBoxHover(e);
        }
    });

    window.addEventListener('mouseup', () => {
        if (isPanning) {
            isPanning = false;
            viewport.classList.remove('panning');
        }

        if (isDraggingNode) {
            saveToCloud();
            isDraggingNode = null;
        }

        if (isDraggingWire) {
            // Find if dropped anywhere inside a node card box
            const targetNode = nodes.find(n => {
                if (n.id === isDraggingWire.fromId) return false;
                const rect = n.element.getBoundingClientRect();
                return (
                    event.clientX >= rect.left &&
                    event.clientX <= rect.right &&
                    event.clientY >= rect.top &&
                    event.clientY <= rect.bottom
                );
            });

            if (targetNode) {
                const sourceNodeId = isDraggingWire.fromId;
                const exists = connections.some(c => c.fromId === sourceNodeId && c.toId === targetNode.id);
                if (!exists) {
                    connections.push({ fromId: sourceNodeId, toId: targetNode.id });
                    saveToCloud();
                }
            }

            document.querySelectorAll('.node').forEach(el => el.classList.remove('wire-target-hover'));
            isDraggingWire = null;
            renderWires();
        }
    });

    viewport.onwheel = (e) => {
        e.preventDefault();
        const zoomFactor = 0.08;
        const oldZoom = zoom;

        if (e.deltaY < 0) {
            zoom = Math.min(zoom + zoomFactor, 2.0);
        } else {
            zoom = Math.max(zoom - zoomFactor, 0.3);
        }

        // Zoom centered on mouse cursor
        panX -= (e.clientX - panX) * (zoom / oldZoom - 1);
        panY -= (e.clientY - panY) * (zoom / oldZoom - 1);

        updateTransform();
    };

    resetViewBtn.onclick = () => {
        panX = 0;
        panY = 0;
        zoom = 1;
        updateTransform();
    };

    // --- BOX WIRE SNAPPING HIGHLIGHT ---
    function checkNodeBoxHover(e) {
        nodes.forEach(n => {
            if (n.id === isDraggingWire.fromId) return;
            const rect = n.element.getBoundingClientRect();
            const isHovered = (
                e.clientX >= rect.left &&
                e.clientX <= rect.right &&
                e.clientY >= rect.top &&
                e.clientY <= rect.bottom
            );

            if (isHovered) {
                n.element.classList.add('wire-target-hover');
            } else {
                n.element.classList.remove('wire-target-hover');
            }
        });
    }

    // --- FIREBASE SYNC ---
    function saveToCloud() {
        const cleanNodes = nodes.map(n => ({ 
            id: n.id, 
            x: n.x, 
            y: n.y, 
            title: n.title,
            status: n.status || 'todo'
        }));
        
        db.ref('planner_state').set({
            nodes: cleanNodes,
            connections: connections
        });
    }

    function debouncedSave() {
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(saveToCloud, 400);
    }

    db.ref('planner_state').on('value', (snapshot) => {
        const data = snapshot.val() || {};
        const incomingNodes = data.nodes || [];
        connections = data.connections || [];

        const currentIds = new Set(incomingNodes.map(n => n.id));

        nodes = nodes.filter(n => {
            if (!currentIds.has(n.id)) {
                if (n.element) n.element.remove();
                return false;
            }
            return true;
        });

        incomingNodes.forEach(inc => {
            let existing = nodes.find(n => n.id === inc.id);
            if (existing) {
                existing.x = inc.x;
                existing.y = inc.y;
                existing.status = inc.status || 'todo';
                existing.element.style.left = inc.x + 'px';
                existing.element.style.top = inc.y + 'px';
                existing.element.style.setProperty('--status-color', STATUS_COLORS[existing.status]);
                
                const input = existing.element.querySelector('.node-title');
                const select = existing.element.querySelector('.status-select');
                if (document.activeElement !== input) {
                    existing.title = inc.title;
                    input.value = inc.title;
                }
                if (document.activeElement !== select) {
                    select.value = existing.status;
                }
            } else {
                createNode(inc.x, inc.y, inc.id, inc.title, inc.status || 'todo', false);
            }
        });

        renderWires();
        renderMinimap();
    });

    function createNode(x, y, id, title = null, status = 'todo', shouldSave = true) {
        const node = {
            id,
            x,
            y,
            title: title || `Task ${nodes.length + 1}`,
            status: status,
            element: null
        };

        const el = document.createElement('div');
        el.className = 'node';
        el.id = `node-${id}`;
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        el.style.setProperty('--status-color', STATUS_COLORS[node.status]);

        el.innerHTML = `
            <div class="node-header">
                <input type="text" class="node-title" value="${node.title}">
                <button class="delete-node">&times;</button>
            </div>
            <div class="node-body">
                <select class="status-select">
                    <option value="todo" ${node.status === 'todo' ? 'selected' : ''}>🔵 To Do</option>
                    <option value="inprog" ${node.status === 'inprog' ? 'selected' : ''}>🟡 In Progress</option>
                    <option value="testing" ${node.status === 'testing' ? 'selected' : ''}>🟣 Testing</option>
                    <option value="done" ${node.status === 'done' ? 'selected' : ''}>🟢 Done</option>
                    <option value="blocked" ${node.status === 'blocked' ? 'selected' : ''}>🔴 Blocked</option>
                </select>
            </div>
            <div class="port port-in" data-type="in"></div>
            <div class="port port-out" data-type="out"></div>
        `;

        el.onmousedown = (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || e.target.tagName === 'SELECT' || e.target.classList.contains('port')) return;
            if (e.button !== 0) return; // Only left click drags
            isDraggingNode = node;
            dragOffsetX = mouseWorldPos.x - node.x;
            dragOffsetY = mouseWorldPos.y - node.y;
            el.style.zIndex = 100;
        };

        el.querySelector('.delete-node').onclick = () => {
            nodes = nodes.filter(n => n.id !== id);
            connections = connections.filter(c => c.fromId !== id && c.toId !== id);
            el.remove();
            renderWires();
            renderMinimap();
            saveToCloud();
        };

        const titleInput = el.querySelector('.node-title');
        titleInput.oninput = (e) => {
            node.title = e.target.value;
            debouncedSave();
        };
        titleInput.onchange = () => {
            clearTimeout(saveTimeout);
            saveToCloud();
        };

        const statusSelect = el.querySelector('.status-select');
        statusSelect.onchange = (e) => {
            node.status = e.target.value;
            el.style.setProperty('--status-color', STATUS_COLORS[node.status]);
            saveToCloud();
        };

        node.element = el;
        nodes.push(node);
        world.appendChild(el);
        
        if (shouldSave) saveToCloud();
    }

    // Start Dragging Wire
    world.onmousedown = (e) => {
        const port = e.target.closest('.port');
        if (port && port.dataset.type === 'out') {
            const nodeId = parseInt(port.closest('.node').id.split('-')[1]);
            isDraggingWire = { fromId: nodeId };
        }
    };

    // --- WIRE RENDERING & CLICK-TO-DELETE ---
    function renderWires() {
        wiresLayer.innerHTML = '';

        connections.forEach(conn => {
            const fromNode = nodes.find(n => n.id === conn.fromId);
            const toNode = nodes.find(n => n.id === conn.toId);
            if (fromNode && toNode) {
                drawBezier(fromNode, toNode, 'wire permanent-wire', conn);
            }
        });

        if (isDraggingWire) {
            const fromNode = nodes.find(n => n.id === isDraggingWire.fromId);
            drawBezier(fromNode, null, 'wire temp-wire', null);
        }
    }

    function drawBezier(fromNode, toNode, className, connectionObj) {
        const fromPort = fromNode.element.querySelector('.port-out').getBoundingClientRect();
        const viewportRect = viewport.getBoundingClientRect();

        const x1 = (fromPort.left - viewportRect.left - panX) / zoom + 6;
        const y1 = (fromPort.top - viewportRect.top - panY) / zoom + 6;

        let x2, y2;

        if (toNode) {
            const toPort = toNode.element.querySelector('.port-in').getBoundingClientRect();
            x2 = (toPort.left - viewportRect.left - panX) / zoom + 6;
            y2 = (toPort.top - viewportRect.top - panY) / zoom + 6;
        } else {
            x2 = mouseWorldPos.x;
            y2 = mouseWorldPos.y;
        }

        const cp1x = x1 + (x2 - x1) * 0.5;
        const cp2x = x1 + (x2 - x1) * 0.5;

        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", `M ${x1} ${y1} C ${cp1x} ${y1}, ${cp2x} ${y2}, ${x2} ${y2}`);
        path.setAttribute("class", className);

        // Click-to-Delete Wire Handler
        if (connectionObj) {
            path.onclick = (e) => {
                e.stopPropagation();
                connections = connections.filter(c => !(c.fromId === connectionObj.fromId && c.toId === connectionObj.toId));
                renderWires();
                saveToCloud();
            };
        }

        wiresLayer.appendChild(path);
    }

    // --- MINIMAP RADAR ---
    function renderMinimap() {
        minimapSvg.querySelectorAll('.minimap-node').forEach(el => el.remove());

        if (nodes.length === 0) return;

        // Find bounding box of all nodes
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        nodes.forEach(n => {
            minX = Math.min(minX, n.x);
            minY = Math.min(minY, n.y);
            maxX = Math.max(maxX, n.x + 250);
            maxY = Math.max(maxY, n.y + 100);
        });

        // Add padding around map
        const pad = 300;
        minX -= pad; minY -= pad;
        maxX += pad; maxY += pad;

        const mapWidth = maxX - minX;
        const mapHeight = maxY - minY;

        const scaleX = 160 / mapWidth;
        const scaleY = 100 / mapHeight;

        nodes.forEach(n => {
            const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            rect.setAttribute("x", (n.x - minX) * scaleX);
            rect.setAttribute("y", (n.y - minY) * scaleY);
            rect.setAttribute("width", Math.max(250 * scaleX, 4));
            rect.setAttribute("height", Math.max(80 * scaleY, 3));
            rect.setAttribute("class", "minimap-node");
            minimapSvg.appendChild(rect);
        });

        // Viewport Frame on Minimap
        const viewW = (window.innerWidth / zoom) * scaleX;
        const viewH = (window.innerHeight / zoom) * scaleY;
        const viewX = (-panX / zoom - minX) * scaleX;
        const viewY = (-panY / zoom - minY) * scaleY;

        minimapView.setAttribute("x", viewX);
        minimapView.setAttribute("y", viewY);
        minimapView.setAttribute("width", viewW);
        minimapView.setAttribute("height", viewH);
    }

    addBtn.onclick = () => {
        const spawnX = (-panX + window.innerWidth / 2 - 125) / zoom;
        const spawnY = (-panY + window.innerHeight / 2 - 50) / zoom;
        createNode(spawnX, spawnY, Date.now());
    };

    clearBtn.onclick = () => {
        nodes.forEach(n => n.element.remove());
        nodes = [];
        connections = [];
        renderWires();
        renderMinimap();
        saveToCloud();
    };

    updateTransform();
</script>
</body>
</html>
